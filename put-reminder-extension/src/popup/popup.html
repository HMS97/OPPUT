<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUT Pattern Reminder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 480px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
    }

    .header {
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }

    .status-dot.inactive {
      background: #666;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #333;
      border-radius: 24px;
      transition: 0.3s;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    input:checked + .toggle-slider {
      background: linear-gradient(90deg, #e94560, #ff6b6b);
    }

    input:checked + .toggle-slider:before {
      transform: translateX(24px);
    }

    .signal-panel {
      padding: 16px;
    }

    .signal-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .signal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .signal-title {
      font-size: 14px;
      font-weight: 600;
    }

    .signal-strength {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .signal-strength.strong {
      background: #e94560;
      color: white;
    }

    .signal-strength.medium {
      background: #f59e0b;
      color: white;
    }

    .signal-strength.weak {
      background: #4ade80;
      color: #1a1a2e;
    }

    .signal-strength.none {
      background: #666;
      color: white;
    }

    .signal-meter {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .signal-meter-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #f59e0b, #e94560);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .patterns-list {
      max-height: 120px;
      overflow-y: auto;
    }

    .pattern-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .pattern-icon {
      width: 24px;
      height: 24px;
      background: #e94560;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .pattern-info {
      flex: 1;
    }

    .pattern-name {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .pattern-desc {
      color: #999;
      font-size: 11px;
    }

    .pattern-tf {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(233, 69, 96, 0.3);
      border-radius: 4px;
      color: #ff6b6b;
    }

    .settings-panel {
      padding: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .settings-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .setting-label {
      font-size: 13px;
    }

    .setting-select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
    }

    .setting-select option {
      background: #1a1a2e;
    }

    /* Timeframe checkboxes */
    .timeframe-group {
      margin-bottom: 16px;
    }

    .timeframe-label {
      font-size: 13px;
      margin-bottom: 8px;
      display: block;
    }

    .timeframe-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tf-checkbox {
      display: none;
    }

    .tf-label {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .tf-label:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .tf-checkbox:checked + .tf-label {
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      border-color: #e94560;
      color: white;
    }

    /* Data source toggle */
    .data-source-group {
      margin-bottom: 16px;
    }

    .data-source-options {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 4px;
    }

    .ds-radio {
      display: none;
    }

    .ds-label {
      flex: 1;
      text-align: center;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .ds-label:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .ds-radio:checked + .ds-label {
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      color: white;
    }

    .ds-icon {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      color: white;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      margin-top: 8px;
    }

    .no-signal {
      text-align: center;
      padding: 24px;
      color: #666;
    }

    .no-signal-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .alert-history {
      padding: 16px;
    }

    .alert-item {
      background: rgba(233, 69, 96, 0.2);
      border-left: 3px solid #e94560;
      padding: 10px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .alert-time {
      color: #999;
      font-size: 10px;
    }

    .alert-tf {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(233, 69, 96, 0.3);
      border-radius: 4px;
      margin-left: 6px;
    }

    footer {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      color: #666;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Active timeframes display */
    .active-timeframes {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .active-tf-badge {
      font-size: 10px;
      padding: 3px 8px;
      background: rgba(74, 222, 128, 0.2);
      border-radius: 4px;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>PUT Pattern Reminder</h1>
    <p>多周期做空信号提醒系统</p>
  </div>

  <div class="status-bar">
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">监控中...</span>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="enableToggle" checked>
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="signal-panel">
    <div class="signal-card">
      <div class="signal-header">
        <span class="signal-title">当前信号 Signal</span>
        <span class="signal-strength none" id="signalBadge">无信号</span>
      </div>
      <div class="signal-meter">
        <div class="signal-meter-fill" id="signalMeter" style="width: 0%"></div>
      </div>
      <p id="recommendation" style="font-size: 13px; color: #999;">
        打开 TradingView 或 Binance 开始监控...
      </p>
      <div class="active-timeframes" id="activeTimeframes"></div>
    </div>

    <div id="patternsContainer">
      <div class="no-signal">
        <div class="no-signal-icon">📊</div>
        <p>暂无检测到的形态</p>
      </div>
    </div>
  </div>

  <div class="settings-panel">
    <div class="settings-title">设置 Settings</div>

    <!-- Data Source Toggle -->
    <div class="data-source-group">
      <span class="setting-label" style="display: block; margin-bottom: 8px;">数据源 Data Source</span>
      <div class="data-source-options">
        <input type="radio" name="dataSource" id="dsRealtime" value="realtime" class="ds-radio" checked>
        <label for="dsRealtime" class="ds-label">
          <span class="ds-icon">🔴</span>
          实时 Real-time
        </label>
        <input type="radio" name="dataSource" id="dsReplay" value="replay" class="ds-radio">
        <label for="dsReplay" class="ds-label">
          <span class="ds-icon">⏪</span>
          回放 Replay
        </label>
      </div>
    </div>

    <!-- Timeframe Selection -->
    <div class="timeframe-group">
      <span class="timeframe-label">时间周期 Timeframe (可多选)</span>
      <div class="timeframe-options">
        <input type="checkbox" id="tf5m" value="5" class="tf-checkbox" checked>
        <label for="tf5m" class="tf-label">5分钟</label>

        <input type="checkbox" id="tf15m" value="15" class="tf-checkbox" checked>
        <label for="tf15m" class="tf-label">15分钟</label>

        <input type="checkbox" id="tf1h" value="60" class="tf-checkbox">
        <label for="tf1h" class="tf-label">1小时</label>

        <input type="checkbox" id="tf4h" value="240" class="tf-checkbox">
        <label for="tf4h" class="tf-label">4小时</label>
      </div>
    </div>

    <div class="setting-row">
      <span class="setting-label">灵敏度 Sensitivity</span>
      <select class="setting-select" id="sensitivity">
        <option value="low">低 Low</option>
        <option value="medium" selected>中 Medium</option>
        <option value="high">高 High</option>
      </select>
    </div>

    <div class="setting-row">
      <span class="setting-label">声音提醒 Sound</span>
      <label class="toggle-switch" style="width: 40px; height: 20px;">
        <input type="checkbox" id="soundToggle" checked>
        <span class="toggle-slider" style="border-radius: 20px;"></span>
      </label>
    </div>

    <div class="setting-row">
      <span class="setting-label">刷新间隔 Refresh</span>
      <select class="setting-select" id="refreshInterval">
        <option value="5">5秒</option>
        <option value="10" selected>10秒</option>
        <option value="30">30秒</option>
        <option value="60">1分钟</option>
      </select>
    </div>

    <button class="btn btn-primary" id="scanNow">
      立即扫描 Scan Now
    </button>
    <button class="btn btn-secondary" id="clearAlerts">
      清除历史 Clear History
    </button>
  </div>

  <div class="alert-history" id="alertHistory">
    <div class="settings-title">最近提醒 Recent Alerts</div>
    <div id="alertList">
      <p style="color: #666; font-size: 12px; text-align: center;">暂无提醒记录</p>
    </div>
  </div>

  <footer>
    PUT Pattern Reminder v1.1 | 多周期版
  </footer>

  <script src="popup.js"></script>
</body>
</html>
